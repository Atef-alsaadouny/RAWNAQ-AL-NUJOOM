services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - .docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - saas-network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=salon_booking
      - DB_USERNAME=salon_user
      - DB_PASSWORD=salon_pass

  mysql:
    image: mysql:8.0
    container_name: saas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: salon_booking
      MYSQL_USER: salon_user
      MYSQL_PASSWORD: salon_pass
      MYSQL_ROOT_PASSWORD: root_secret_pass
    volumes:
      - saas-mysql-data:/var/lib/mysql
    networks:
      - saas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3307:3306"

  nginx:
    image: nginx:alpine
    container_name: saas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - saas-network
    depends_on:
      - app

volumes:
  saas-mysql-data:
    external: true
    name: saas_saas-mysql-data

networks:
  saas-network:
    driver: bridge